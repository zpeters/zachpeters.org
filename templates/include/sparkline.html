{{define "sparkline.html"}}
{{/* Weekly GitHub contributions, past year, as a Tufte sparkline: no axes,
     the latest week in red, the highest in gray, with their values. */}}
{{with contributions}}
<a class="spark" href="https://github.com/zpeters"
  aria-label="GitHub profile. Weekly contributions from {{.From.Format "January 2006"}} to {{.To.Format "January 2006"}}: {{.Total}} in all, highest week {{.Max}}, latest week {{.Last}}.">
  <em class="spark-label">contributions per week</em>
  <svg class="spark-line" viewBox="-30 -22 360 64" aria-hidden="true">
    <polyline points="{{.Points}}" />
    <circle class="spark-max" cx="{{.MaxX}}" cy="{{.MaxY}}" r="3" />
    <text x="{{.MaxX}}" y="{{.MaxY}}" dy="-9" text-anchor="middle">peak {{.Max}}</text>
    <circle class="spark-last" cx="{{.LastX}}" cy="{{.LastY}}" r="3" />
    <text class="spark-last" x="{{.LastX}}" y="{{.LastY}}" dx="8" dy="4">last {{.Last}}</text>
  </svg>
</a>
{{end}}
{{end}}
