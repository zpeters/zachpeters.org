{{template "header.html"}}
<h2>{{.title}}</h2>

<section>
{{ if .posts }}
  <ul>
    {{range .posts}}
      <li>
          {{.Date.Format "2006-01-02"}} -
          <a href="/blog/{{.URL}}">
            {{.Title}}
          </a>
      </li>
    {{end}}
  </ul>
{{ else }}
  <p>Nothing yet...</p>
{{ end }}
</section>

{{template "footer.html"}}
