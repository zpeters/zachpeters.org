{{template "header.html" .}}
<h2>{{.title}}</h2>

<section>
<a href="/rss">RSS Feed</a>
{{ if .posts }}
  <ul>
    {{range .posts}}
      <li>
          <a href="/blog/{{.URL}}">
            {{.Title}}
          </a> 
          -
          <em>{{.Date.Format "Jan 2, 2006"}}</em>
      </li>
    {{end}}
  </ul>
{{ else }}
  <p>Nothing yet...</p>
{{ end }}
</section>

{{template "footer.html"}}
