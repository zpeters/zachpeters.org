{{template "header.html" .}}
<h2>{{.title}}</h2>

<section>
<a href="/rss">RSS Feed</a>
{{ if .posts }}
  <ul class="post-list">
    {{range .posts}}
      <li>
        <a href="/blog/{{.URL}}">{{.Title}}</a>
        <time class="list-date" datetime="{{.Date.Format "2006-01-02"}}">{{.FormattedDate}}</time>
      </li>
    {{end}}
  </ul>
{{ else }}
  <p>Nothing yet...</p>
{{ end }}
</section>

{{template "footer.html"}}
